name: chess
functions:
  indexChessGames:
    path: ./index.ts:indexChessGames
    events:
      - page:index
  deleteChessGamesForPage:
    path: ./index.ts:deleteChessGamesForPage
    events:
      - page:deleted
  fenWidget:
    path: ./chess.ts:fenWidget
    codeWidget: fen
    renderMode: iframe
  pgnWidget:
    path: ./chess.ts:pgnWidget
    codeWidget: pgn
    renderMode: iframe
  puzzleWidget:
    path: ./chess.ts:puzzleWidget
    codeWidget: puzzle
    renderMode: iframe
  chessLegalMoves:
    path: ./chess.ts:legalMoves
    syscall:
      name: chess.legalMoves
      description: Legal destination squares for the piece on a given square in a FEN position.
      parameters:
        - { name: fen, type: string }
        - { name: square, type: string }
      returns:
        - { type: array }
  chessApplyMove:
    path: ./chess.ts:applyMove
    syscall:
      name: chess.applyMove
      description: Applies a from/to (+ optional promotion) move to a FEN position using chess.js.
      parameters:
        - { name: fen, type: string }
        - { name: from, type: string }
        - { name: to, type: string }
        - { name: promotion, type: string }
      returns:
        - { type: object }
  chessApplySan:
    path: ./chess.ts:applySan
    syscall:
      name: chess.applySan
      description: Applies a move given in SAN notation to a FEN position using chess.js.
      parameters:
        - { name: fen, type: string }
        - { name: san, type: string }
      returns:
        - { type: object }
  chessRenderStaticBoardHtml:
    path: ./board_renderer.ts:renderStaticBoardHtml
    syscall:
      name: chess.renderStaticBoardHtml
      description: >-
        A fully static rendering of a FEN position (every square/piece baked
        into the returned HTML, no iframe/interactivity) — used by
        chess-pdf-export for print output.
      parameters:
        - { name: fen, type: string }
        - { name: opts, type: object }
      returns:
        - { type: string }
  chessGetCss:
    path: ./board_renderer.ts:getChessCss
    syscall:
      name: chess.getCss
      description: The shared CSS for chessnote-container/chess-board markup.
      returns:
        - { type: string }
  chessExtractChessGames:
    path: ./index.ts:extractChessGames
    syscall:
      name: chess.extractChessGames
      description: >-
        Extracts one chess-game object per ```pgn``` code block found on a
        page's parse tree — the same header-parsing logic the page:index
        indexer itself uses.
      parameters:
        - { name: pageName, type: string }
        - { name: tree, type: object }
      returns:
        - { type: array }
  chessTextExtractKeywords:
    path: ./text_normalize.ts:extractKeywords
    syscall:
      name: chess.textExtractKeywords
      description: >-
        Normalizes (strip diacritics, lowercase) and tokenizes a Vietnamese
        question into search keywords, dropping common stopwords — used to
        keep search-side tokenization identical to the FTS5 index-side one.
      parameters:
        - { name: question, type: string }
      returns:
        - { type: array }
  chessIsRepertoirePage:
    path: ./index.ts:isRepertoirePage
    syscall:
      name: chess.isRepertoirePage
      description: >-
        True if a page's frontmatter marks it as an opening-repertoire page
        (`tags: repertoire`) rather than a real played game.
      parameters:
        - { name: frontmatter, type: object }
      returns:
        - { type: boolean }
