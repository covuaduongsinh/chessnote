services:
  # 1. ChessNote Full Web Application Server
  chessnote-app:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    image: chessnote-app:latest
    container_name: chessnote-app
    restart: unless-stopped
    environment:
      - SB_HOSTNAME=0.0.0.0
      - SB_PORT=3000
      - SB_FOLDER=/space
      - SB_USER=${SB_AUTH_USER:-admin:MatKhauManh2026!}
      - CHROMIUM_PATH=/usr/bin/chromium-browser
      - SB_CHROME_DATA_DIR=/tmp/chrome-data
    volumes:
      - chessnote-space-data:/space
    networks:
      - chessnote-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3000/.instance"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 2. ChessNote Cloud Sync Hub (WebDAV + WebSocket Push Notification)
  chessnote-sync:
    build:
      context: ./cloud-server
      dockerfile: Dockerfile
    image: chessnote-sync:latest
    container_name: chessnote-sync
    restart: unless-stopped
    environment:
      - CHESSNOTE_CLOUD_PORT=8080
      - CHESSNOTE_CLOUD_DATA_DIR=/data
      - CHESSNOTE_CLOUD_USERS=${SYNC_USERS:-admin:MatKhauSync2026!}
    volumes:
      - chessnote-sync-data:/data
    networks:
      - chessnote-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 3. ChessNote AI Sidecar Service
  chessnote-ai:
    build:
      context: ./ai-sidecar
      dockerfile: Dockerfile
    image: chessnote-ai:latest
    container_name: chessnote-ai
    restart: unless-stopped
    environment:
      - AI_SIDECAR_PORT=3457
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    networks:
      - chessnote-net

  # 4. Caddy Web Server & Reverse Proxy (Automatic SSL)
  caddy:
    image: caddy:2-alpine
    container_name: chessnote-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-chessnote.dsc.edu.vn}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - chessnote-net
    depends_on:
      - chessnote-app
      - chessnote-sync

networks:
  chessnote-net:
    name: chessnote-net
    driver: bridge

volumes:
  chessnote-space-data:
    name: chessnote-space-data
  chessnote-sync-data:
    name: chessnote-sync-data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
